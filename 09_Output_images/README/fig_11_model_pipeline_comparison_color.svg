<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="760" viewBox="0 0 1310 760" role="img" aria-labelledby="title descr"><title id="title">Three distinct QuCNet study pathways</title><desc id="descr">Historical paper-structured quantum CNN, strict case-separated classical CNN, and matched development-only classical and quantum feature classification. The evaluation units differ and should not be confused.</desc><rect width="1310" height="760" fill="#FFFFFF"/><rect width="9" height="760" fill="#138D82"/><text x="39" y="46" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" text-anchor="start" fill="#138D82">MODEL ARCHITECTURE &amp; EVALUATION PATHWAYS</text><text x="39" y="83" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="760" text-anchor="start" fill="#173450">Three different experiments — not one interchangeable model</text><text x="39" y="117" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="480" text-anchor="start" fill="#60798D">Phase 9 historical implementation  •  Phase 14 case-separated CNN  •  Controlled training-only fixed-feature comparison</text><rect x="35" y="143" width="390" height="568" rx="18" fill="#F7FAFD" stroke="#D7E5EF" stroke-width="1.2"/><rect x="35" y="143" width="390" height="8" rx="4" fill="#2273CE"/><rect x="462" y="143" width="390" height="568" rx="18" fill="#F7FAFD" stroke="#D7E5EF" stroke-width="1.2"/><rect x="462" y="143" width="390" height="8" rx="4" fill="#8657C9"/><rect x="889" y="143" width="390" height="568" rx="18" fill="#F7FAFD" stroke="#D7E5EF" stroke-width="1.2"/><rect x="889" y="143" width="390" height="8" rx="4" fill="#138D82"/><text x="230" y="184" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#2273CE">HISTORICAL PHASE 9</text><text x="230" y="209" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="540" text-anchor="middle" fill="#566E82">Paper-structured six-class QCNN</text><rect x="60" y="233" width="340" height="65" rx="10" fill="#FFFFFF" stroke="#2273CE" stroke-width="2.2"/><text x="230" y="257" text-anchor="middle" fill="#173450" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="750">128×128 grayscale input</text><text x="230" y="278" text-anchor="middle" fill="#526C82" font-family="Arial,Helvetica,sans-serif" font-size="13">Original-image preprocessing</text><line x1="230" y1="300" x2="230" y2="325" stroke="#2273CE" stroke-width="2.5"/><path d="M 223 317 L 230 329 L 237 317" fill="none" stroke="#2273CE" stroke-width="2"/><rect x="60" y="332" width="340" height="65" rx="10" fill="#FFFFFF" stroke="#2273CE" stroke-width="2.2"/><text x="230" y="356" text-anchor="middle" fill="#173450" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="750">4-qubit simulated QFT</text><text x="230" y="377" text-anchor="middle" fill="#526C82" font-family="Arial,Helvetica,sans-serif" font-size="13">2×2 patches → 64×64×4 maps</text><line x1="230" y1="399" x2="230" y2="424" stroke="#2273CE" stroke-width="2.5"/><path d="M 223 416 L 230 428 L 237 416" fill="none" stroke="#2273CE" stroke-width="2"/><rect x="60" y="431" width="340" height="65" rx="10" fill="#FFFFFF" stroke="#2273CE" stroke-width="2.2"/><text x="230" y="455" text-anchor="middle" fill="#173450" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="750">Conv2D 16 → Pool → Conv2D 32</text><text x="230" y="476" text-anchor="middle" fill="#526C82" font-family="Arial,Helvetica,sans-serif" font-size="13">Two convolution/pooling pairs</text><line x1="230" y1="498" x2="230" y2="523" stroke="#2273CE" stroke-width="2.5"/><path d="M 223 515 L 230 527 L 237 515" fill="none" stroke="#2273CE" stroke-width="2"/><rect x="60" y="530" width="340" height="65" rx="10" fill="#FFFFFF" stroke="#2273CE" stroke-width="2.2"/><text x="230" y="554" text-anchor="middle" fill="#173450" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="750">Dense 128 → Dense 64 → 6</text><text x="230" y="575" text-anchor="middle" fill="#526C82" font-family="Arial,Helvetica,sans-serif" font-size="13">Adam LR 1e-4 · max 120 epochs</text><rect x="60" y="643" width="340" height="55" fill="#2273CE" rx="9"/><text x="230" y="665" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="750" text-anchor="middle" fill="#FFFFFF">70 historical test images · 13 correct</text><text x="230" y="686" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="550" text-anchor="middle" fill="#FFFFFF">Image-level test already inspected</text><text x="657" y="184" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#8657C9">STRICT PHASE 14</text><text x="657" y="209" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="540" text-anchor="middle" fill="#566E82">Case-separated ROI CNN (no quantum)</text><rect x="487" y="233" width="340" height="65" rx="10" fill="#FFFFFF" stroke="#8657C9" stroke-width="2.2"/><text x="657" y="257" text-anchor="middle" fill="#173450" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="750">64×64×1 lesion ROI</text><text x="657" y="278" text-anchor="middle" fill="#526C82" font-family="Arial,Helvetica,sans-serif" font-size="13">Median-filled square crop</text><line x1="657" y1="300" x2="657" y2="325" stroke="#8657C9" stroke-width="2.5"/><path d="M 650 317 L 657 329 L 664 317" fill="none" stroke="#8657C9" stroke-width="2"/><rect x="487" y="332" width="340" height="65" rx="10" fill="#FFFFFF" stroke="#8657C9" stroke-width="2.2"/><text x="657" y="356" text-anchor="middle" fill="#173450" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="750">Classical Conv2D + BatchNorm</text><text x="657" y="377" text-anchor="middle" fill="#526C82" font-family="Arial,Helvetica,sans-serif" font-size="13">32/64/64/96 filters · ReLU</text><line x1="657" y1="399" x2="657" y2="424" stroke="#8657C9" stroke-width="2.5"/><path d="M 650 416 L 657 428 L 664 416" fill="none" stroke="#8657C9" stroke-width="2"/><rect x="487" y="431" width="340" height="65" rx="10" fill="#FFFFFF" stroke="#8657C9" stroke-width="2.2"/><text x="657" y="455" text-anchor="middle" fill="#173450" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="750">Global average pooling</text><text x="657" y="476" text-anchor="middle" fill="#526C82" font-family="Arial,Helvetica,sans-serif" font-size="13">Dense 64 → 6-way softmax</text><line x1="657" y1="498" x2="657" y2="523" stroke="#8657C9" stroke-width="2.5"/><path d="M 650 515 L 657 527 L 664 515" fill="none" stroke="#8657C9" stroke-width="2"/><rect x="487" y="530" width="340" height="65" rx="10" fill="#FFFFFF" stroke="#8657C9" stroke-width="2.2"/><text x="657" y="554" text-anchor="middle" fill="#173450" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="750">Adam LR 1e-3 · max 100</text><text x="657" y="575" text-anchor="middle" fill="#526C82" font-family="Arial,Helvetica,sans-serif" font-size="13">134,742 model parameters</text><rect x="487" y="643" width="340" height="55" fill="#8657C9" rx="9"/><text x="657" y="665" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="750" text-anchor="middle" fill="#FFFFFF">71 ROI / 44 case historical test</text><text x="657" y="686" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="550" text-anchor="middle" fill="#FFFFFF">Class collapse · 4 ROI / 2 cases correct</text><text x="1084" y="184" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#138D82">EXT-MODELS-001</text><text x="1084" y="209" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="540" text-anchor="middle" fill="#566E82">Matched feature + classifier analysis</text><rect x="914" y="233" width="340" height="65" rx="10" fill="#FFFFFF" stroke="#138D82" stroke-width="2.2"/><text x="1084" y="257" text-anchor="middle" fill="#173450" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="750">311 ROIs · 203 TRAIN cases</text><text x="1084" y="278" text-anchor="middle" fill="#526C82" font-family="Arial,Helvetica,sans-serif" font-size="13">Fivefold case-stratified OOF</text><line x1="1084" y1="300" x2="1084" y2="325" stroke="#138D82" stroke-width="2.5"/><path d="M 1077 317 L 1084 329 L 1091 317" fill="none" stroke="#138D82" stroke-width="2"/><rect x="914" y="332" width="340" height="65" rx="10" fill="#FFFFFF" stroke="#138D82" stroke-width="2.2"/><text x="1084" y="356" text-anchor="middle" fill="#173450" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="750">Classical 64 | fixed quantum 64</text><text x="1084" y="377" text-anchor="middle" fill="#526C82" font-family="Arial,Helvetica,sans-serif" font-size="13">8×8 pooled | 16 four-qubit patches</text><line x1="1084" y1="399" x2="1084" y2="424" stroke="#138D82" stroke-width="2.5"/><path d="M 1077 416 L 1084 428 L 1091 416" fill="none" stroke="#138D82" stroke-width="2"/><rect x="914" y="431" width="340" height="65" rx="10" fill="#FFFFFF" stroke="#138D82" stroke-width="2.2"/><text x="1084" y="455" text-anchor="middle" fill="#173450" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="750">LR · RBF SVM · RF · kNN</text><text x="1084" y="476" text-anchor="middle" fill="#526C82" font-family="Arial,Helvetica,sans-serif" font-size="13">Same four classifier families</text><line x1="1084" y1="498" x2="1084" y2="523" stroke="#138D82" stroke-width="2.5"/><path d="M 1077 515 L 1084 527 L 1091 515" fill="none" stroke="#138D82" stroke-width="2"/><rect x="914" y="530" width="340" height="65" rx="10" fill="#FFFFFF" stroke="#138D82" stroke-width="2.2"/><text x="1084" y="554" text-anchor="middle" fill="#173450" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="750">Case-probability averaging</text><text x="1084" y="575" text-anchor="middle" fill="#526C82" font-family="Arial,Helvetica,sans-serif" font-size="13">Sensitivity / specificity / macro AUC</text><rect x="914" y="643" width="340" height="55" fill="#138D82" rx="9"/><text x="1084" y="665" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="750" text-anchor="middle" fill="#FFFFFF">Eight exploratory model variants</text><text x="1084" y="686" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="550" text-anchor="middle" fill="#FFFFFF">Best accuracy 63/203; no proven advantage</text><text x="39" y="737" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="520" text-anchor="start" fill="#60798D">Case-ID separation is not verified patient independence. The fixed quantum filter is untrained; later OOF scores are not the Phase 9/14 test set.</text></svg>